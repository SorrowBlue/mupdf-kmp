name: Build
on:
  workflow_call:

jobs:

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run publishAndroidPublicationToMavenLocal
        run: ./gradlew :lib:publishAndroidPublicationToMavenLocal
      - name: Run assembleDebug
        run: ./gradlew assembleDebug
      - name: Upload lib
        uses: actions/upload-artifact@v7
        with:
          name: mupdf-kmp-android
          path: ~/.m2/repository/
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: desktopApp-debug.apk
          path: desktopApp/build/outputs/apk/debug/

  build-windows-binary:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build MuPDF binary for Windows
        uses: ./.github/actions/build-windows-binary

  build-linux-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build MuPDF binary for Windows
        uses: ./.github/actions/build-linux-binary

  build-desktop:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    needs:
      - build-windows-binary
      - build-linux-binary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          path: lib/src/jvmMain/resources/
          merge-multiple: true
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run publishJvmPublicationToMavenLocal
        run: ./gradlew :lib:publishJvmPublicationToMavenLocal
      - name: Run packageDistributionForCurrentOS
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS
      - name: Upload lib
        uses: actions/upload-artifact@v7
        with:
          name: mupdf-kmp-jvm-${{ runner.os }}
          path: ~/.m2/repository/
      - name: Upload Desktop Binaries
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/

  check-build:
    name: All Build Passed
    runs-on: ubuntu-latest
    needs: [ build-android, build-desktop ]
    steps:
      - name: Confirm All Build Jobs Succeeded
        run: echo "✅ All build jobs (Android, Windows, macOS, Linux) completed successfully."
